name: Sync config from Apps Script

# Нөөц синк: админ хадгалах бvрт Apps Script өөрөө config.json-г шууд commit хийдэг
# (publishConfigToGitHub). Энэ workflow нь Sheet-ийг гараар засах гэх мэт тохиолдолд
# хоцорсон өөрчлөлтийг барьж авна. GitHub cron-ыг бодит байдалд 15–20 минут тутам л
# ажиллуулдаг.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-config
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Fetch and validate latest config from Apps Script
        id: fetch
        run: |
          URL="https://script.google.com/macros/s/AKfycbwK2ONqsmKYgOTw2CXBVpDp8RVAtPzu5dm_P5RjMZfsp2SXKkw59GdsRUEB5S7fvdO8Vw/exec"
          OUT="$RUNNER_TEMP/config.json.new"
          ATTEMPTS=5
          script_errors=0
          gone=0
          for attempt in $(seq 1 $ATTEMPTS); do
            code=$(curl -sL --max-time 25 -o "$OUT" -w "%{http_code}" "$URL" || true)
            # 404/410: web app-ийн deployment устгагдсан/архивлагдсан (URL хvчингvй болсон).
            if [ "$code" = "404" ] || [ "$code" = "410" ]; then gone=$((gone + 1)); fi
            if [ "$code" = "200" ] && node -e "
              const d = JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'));
              process.exit(Array.isArray(d.weeks) ? 0 : 1);
            " "$OUT" 2>/dev/null; then
              echo "Valid JSON received (attempt $attempt)."
              echo "fetched=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Apps Script-ийн тохиргоо/кодын алдааны хуудас эсэх. Google-ийн тvр зуурын алдааны
            # хуудсууд дотор JavaScript (жишээ нь "TypeError" гэсэн vг) байдаг тул <script>/<style>
            # хэсгийг хасаад зөвхөн харагдах текстээс хайна.
            if [ -s "$OUT" ] && node -e "
              const t = require('fs').readFileSync(process.argv[1], 'utf8')
                .replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ');
              process.exit(/Authorization is required|Script function not found|TypeError|ReferenceError|SyntaxError/i.test(t) ? 0 : 1);
            " "$OUT" 2>/dev/null; then
              script_errors=$((script_errors + 1))
            fi
            echo "Attempt $attempt failed (HTTP ${code:-none}), retrying..."
            if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep $((attempt * 5)); fi
          done

          if [ "$gone" -eq "$ATTEMPTS" ]; then
            echo "::error title=Apps Script web app URL no longer exists::HTTP ${code} on every attempt — the deployment was archived or deleted. Use Manage deployments → Edit → New version (keeps the URL), or update APPS_SCRIPT_URL in index.html, admin.html and this workflow to the new /exec URL."
            exit 1
          fi

          # Бvх оролдлого ижил алдааны хуудас буцаасан бол л байнгын эвдрэл (эзэмшигч засах
          # шаардлагатай) гэж vзнэ — нэг удаагийн тохиолдол тvр саатал байдаг.
          if [ "$script_errors" -eq "$ATTEMPTS" ]; then
            echo "::error title=Apps Script deployment problem::Apps Script returned an authorization or script error. Open the Apps Script editor, redeploy and grant permissions if asked."
            head -c 600 "$OUT"; echo
            exit 1
          fi

          # Тvр зуурын саатал (timeout / 5xx): сайт сvvлийн зөв config.json-оор хэвийн
          # ажилласаар байгаа тул алдааны имэйл илгээхгvй, зөвхөн анхааруулга vлдээнэ.
          echo "::warning title=Apps Script temporarily unavailable::All 5 attempts failed (last HTTP ${code:-none}). Keeping the existing config.json; the next run will retry."
          echo "fetched=false" >> "$GITHUB_OUTPUT"

      - name: Commit and push if changed
        if: steps.fetch.outputs.fetched == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Apps Script мөн config.json-г шууд commit хийдэг. Энэ ажиллалт эхэлснээс хойш
          # main дээрх config.json өөрчлөгдсөн бол тэр нь манай snapshot-оос шинэ байж
          # болзошгvй тул дарж бичихгvй — дараагийн ажиллалт шинэчилнэ. Бусад файлын
          # commit-оос болж push татгалзвал сvvлийн төлөв дээр 3 хvртэл дахин оролдоно.
          START_BLOB=$(git rev-parse HEAD:config.json)
          for attempt in 1 2 3; do
            git fetch -q origin main
            if [ "$(git rev-parse origin/main:config.json)" != "$START_BLOB" ]; then
              echo "config.json was updated on main during this run; skipping so newer data is not overwritten."
              exit 0
            fi
            git reset -q --hard origin/main
            cp "$RUNNER_TEMP/config.json.new" config.json
            git add config.json
            if git diff --staged --quiet; then
              echo "config.json already up to date."
              exit 0
            fi
            git commit -q -m "Auto-sync config.json from Apps Script"
            if git push -q origin HEAD:main; then
              echo "Pushed updated config.json."
              exit 0
            fi
            echo "Push rejected (concurrent update), retrying..."
            sleep 3
          done
          echo "::error::Could not push config.json after 3 attempts."
          exit 1
