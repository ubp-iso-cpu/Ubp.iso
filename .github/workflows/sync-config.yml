name: Sync config from Apps Script

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate latest config from Apps Script (дотооддоо дахин оролдоно)
        run: |
          URL="https://script.google.com/macros/s/AKfycbwq2Oeh5PEyqoT1SAD3HAahmSrOtAYL4n5lUCzGDIWZtI06es05-0v9yfGonSZKIXXv/exec"
          for attempt in 1 2 3 4 5; do
            echo "Attempt $attempt..."
            curl -sL --max-time 25 "$URL" -o config.json.new || true
            if node -e "
              const fs = require('fs');
              try {
                const d = JSON.parse(fs.readFileSync('config.json.new', 'utf8'));
                process.exit(Array.isArray(d.weeks) ? 0 : 1);
              } catch (e) { process.exit(1); }
            "; then
              echo "Valid JSON received."
              mv config.json.new config.json
              exit 0
            fi
            echo "Invalid/failed response, retrying after delay..."
            sleep $((attempt * 5))
          done
          echo "All attempts failed — Apps Script may be having a transient issue. Leaving existing config.json unchanged."
          exit 1

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.json
          git diff --staged --quiet || git commit -m "Auto-sync config.json from Apps Script"
          git push
